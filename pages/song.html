<!DOCTYPE html>
<html>
<head>
    <title>¡Adivina la canción!</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/navigation.js"></script>
    <script src="../assets/js/music.js"></script>
</head>
<body>
    <div id="songs">
        <div id="music-panel" class="">
            <p id="song-status">Cargando canción...</p>
            <audio id="song"><source id="song-source" src="" type="audio/ogg"></audio>
            <div class="music-controls">
                <div>
                    <button id="play-pause" class="pause"></button>
                </div>
                <div>
                    <button class="replay-button"></button>
                </div>
            </div>
            <button id="sol-button" class="next-button">Ver solución</button>
        </div>
        
        <div id="music-info" class="hide">
            <div id="song-info"></div>
            <button id="scan-button" class="next-button" onclick="goNextFromSong()">Siguiente canción 🡢</button>
        </div>
    </div>
</body>
</html>
