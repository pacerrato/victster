<!DOCTYPE html>
<html>
<head>
    <title>Main menu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">  
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="settings.js"></script>
    <script src="play/scripts/qrlib.js"></script>
<script>
    function PlayMusic() {
        var play=document.getElementById("welcome-song");
        play.play();
    }
    </script>
</head>
<body>
    <div id="main-menu">
        <audio id="welcome-song"><source src="media/release-me.mp3" type="audio/mpeg"></audio>
        <h1>HITSTER</h1>
        <h2 id="subtitle">Victi super special edition</h2>
        <img id="vinyl" src="media/vinilo.webp">
        <a href="play/normal/scan.html" class="button">Play!</a>
        <button id="settings-button" class="button" onclick="openSettings();">Configuración</button>

        <!-- Settings box -->
        <div id="settings-box" class="hide">
            <div id="settings-content">
                <button id="close-button" onclick="closeSettings();"><i class="material-icons">close</i></button>
                <h2>Configuración</h2>
                <label for="camera">Cámara:</label>
                <select name="camera" id="camera-select">
                </select>
                <button id="save-button" class="button" onclick="saveSettings();">Guardar</button>
            </div>
        </div>
    </div>

    
    <script>setTimeout(PlayMusic,100); loadCameras();</script>
</body>
</html>
