<!DOCTYPE html>
<html>
<head>
    <title>VICTSTER</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="../assets/js/home.js"></script>
    <script src="../assets/js/navigation.js"></script>
    <script src="assets/js/settings.js"></script>
    <script src="assets/js/qrlib.js"></script>
    <script>
        function PlayMusic() {
            var play=document.getElementById("welcome-song");
            play.play();
        }
    </script>
</head>
<body>
    <div id="main-menu">
        <audio id="welcome-song"></audio>
        <h1>VICTSTER</h1>
        <h2 id="subtitle">24<sup>th</sup> anniversary edition</h2>
        <img id="vinyl" src="assets/media/vinilo.webp">
        <a href="pages/mode.html" class="button">Play!</a>
        <button id="settings-button" class="button" onclick="openSettings();">Configuración</button>
        
        <!-- Settings box -->
        <div id="settings-box" class="hide">
            <div id="settings-content">
                <button class="close-button" onclick="goBack()"></button>
                <h2>Configuración</h2>
                <label for="camera">Cámara:</label>
                <select name="camera" id="camera-select">
                </select>
                <button id="save-button" class="button" onclick="saveSettings();closeSettings();">Guardar</button>
            </div>
        </div>
    </div>
    <script>loadCameras();</script>
</body>
</html>
