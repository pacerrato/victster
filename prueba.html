<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="style.css">
    <script src="../scripts/qrlib.js"></script>
    <script src="../scripts/qrscan.js"></script>
    <title>Scan</title>
    <script>document.addEventListener('DOMContentLoaded', function() {
let lastResult;
let html5QrCode = new Html5Qrcode("qr-reader");

function onScanSuccess(decodedText, decodedResult) {
    if (decodedText !== lastResult) {
        lastResult = decodedText;
        window.open('https://optwo.id/?scan=' + decodedText, '_blank');
    }
}

function startScan() {
    Html5Qrcode.getCameras().then(cameras => {
        if (cameras && cameras.length) {
            // Assumendo che l'ultima fotocamera nell'elenco sia quella posteriore
            let cameraId = cameras[cameras.length - 1].id;
            html5QrCode.start(
              cameraId, 
              { fps: 10, qrbox: { width: 300, height: 300 } },
              onScanSuccess,
              errorMessage => {
                  console.log(`QR Code no longer in front of camera.`);
              })
            .catch(err => {
                console.log(`Unable to start scanning, error: ${err}`);
            });
        }
    }).catch(err => {
        console.error("Impossibile accedere alla lista delle telecamere", err);
    });
}

function stopScan() {
    html5QrCode.stop().then(ignore => {
        console.log("Scanning stopped.");
    }).catch(err => {
        console.error("Unable to stop scanning.", err);
    });
}

document.getElementById('startButton').addEventListener('click', function() {
    startScan();
    this.style.display = 'none';
    document.getElementById('stopButton').style.display = 'block';
});

document.getElementById('stopButton').addEventListener('click', function() {
    stopScan();
    this.style.display = 'none';
    document.getElementById('startButton').style.display = 'block';
});
    });
    </script>
</head>
<body>
    <div id="qr-reader"></div> <button id="startButton" onclick="startScan();">Start Scan</button> <button id="stopButton" style="display:none;"onclick="stopScan();">Stop Scan</button>
</body>
</html>
